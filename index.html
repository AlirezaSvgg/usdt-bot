<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💎 آربیتراژ تتر | USDT Arbitrage</title>
    
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #e2e8f0;
            --hint: #94a3b8;
            --green: #10b981;
            --red: #ef4444;
            --yellow: #f59e0b;
            --blue: #3b82f6;
            --purple: #8b5cf6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 12px;
            padding-bottom: 40px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .container { max-width: 480px; margin: 0 auto; }

        /* Header */
        .header {
            text-align: center;
            padding: 24px 0 16px;
            position: relative;
        }

        .header-badge {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px;
            font-size: 11px;
            color: var(--green);
            margin-bottom: 12px;
        }

        .header-icon {
            font-size: 56px;
            display: block;
            margin-bottom: 8px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .header h1 {
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            color: var(--hint);
        }

        /* Investment Card */
        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .card-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--hint);
            margin-bottom: 12px;
        }

        .card-label .emoji { font-size: 18px; }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-row input {
            flex: 1;
            padding: 16px;
            font-size: 22px;
            font-weight: 800;
            border-radius: 14px;
            border: 2px solid var(--border);
            background: var(--bg);
            color: var(--text);
            outline: none;
            text-align: center;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .input-row input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .currency {
            padding: 14px 18px;
            background: var(--bg);
            border-radius: 14px;
            border: 2px solid var(--border);
            font-weight: 700;
            font-size: 14px;
            color: var(--hint);
            white-space: nowrap;
        }

        .quick-amounts {
            display: flex;
            gap: 6px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .quick-btn {
            flex: 1;
            min-width: 60px;
            padding: 10px 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--hint);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .quick-btn:active {
            background: var(--blue);
            color: white;
            border-color: var(--blue);
            transform: scale(0.95);
        }

        /* Main Button */
        .btn-main {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-main:active {
            transform: scale(0.97);
        }

        .btn-main.loading {
            background: var(--card);
            color: var(--hint);
            pointer-events: none;
        }

        .btn-main .pulse {
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.1);
            animation: btnPulse 2s infinite;
        }

        @keyframes btnPulse {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        /* Status */
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            font-size: 12px;
            color: var(--hint);
            margin-bottom: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            animation: dotPulse 2s infinite;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.5); }
        }

        /* Arbitrage Result */
        .arbitrage-banner {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(59, 130, 246, 0.1));
            border: 2px solid rgba(16, 185, 129, 0.2);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 10px;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .arbitrage-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .arb-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .arb-mini {
            padding: 14px;
            border-radius: 14px;
            text-align: center;
            transition: transform 0.3s;
        }

        .arb-mini.buy {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .arb-mini.sell {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        .arb-mini-label {
            font-size: 11px;
            color: var(--hint);
            margin-bottom: 6px;
        }

        .arb-mini-exchange {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .arb-mini-price {
            font-size: 20px;
            font-weight: 900;
        }

        .arb-mini-fee {
            font-size: 10px;
            color: var(--hint);
            margin-top: 4px;
        }

        .spread-bar {
            text-align: center;
            padding: 12px;
            background: rgba(245, 158, 11, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .spread-label {
            font-size: 11px;
            color: var(--hint);
            margin-bottom: 2px;
        }

        .spread-value {
            font-size: 20px;
            font-weight: 800;
            color: var(--yellow);
        }

        .spread-pct {
            font-size: 13px;
            color: var(--yellow);
            margin-top: 2px;
        }

        /* Profit Card */
        .profit-card {
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
        }

        .profit-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .profit-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
        }

        .profit-row:last-of-type { border-bottom: none; }

        .profit-label { font-size: 13px; color: var(--hint); }
        .profit-value { font-weight: 600; font-size: 14px; }

        .profit-highlight {
            margin-top: 14px;
            padding: 18px;
            border-radius: 16px;
            text-align: center;
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .profit-highlight.positive {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.05));
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .profit-highlight.negative {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.05));
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .profit-highlight-label {
            font-size: 12px;
            color: var(--hint);
            margin-bottom: 4px;
        }

        .profit-highlight-value {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .profit-highlight-pct {
            font-size: 15px;
            margin-top: 4px;
            font-weight: 600;
        }

        .green-text { color: var(--green); }
        .red-text { color: var(--red); }
        .yellow-text { color: var(--yellow); }

        /* Exchanges Card */
        .exchanges-title {
            font-size: 13px;
            color: var(--hint);
            margin-bottom: 10px;
            padding: 0 4px;
        }

        .exchange-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--card);
            border-radius: 14px;
            margin-bottom: 6px;
            border: 1px solid var(--border);
        }

        .ex-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ex-icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
            color: white;
        }

        .ex-name {
            font-weight: 600;
            font-size: 14px;
        }

        .ex-prices {
            text-align: left;
            direction: ltr;
        }

        .ex-bid {
            font-size: 13px;
            color: var(--red);
            font-weight: 700;
        }

        .ex-ask {
            font-size: 13px;
            color: var(--green);
            font-weight: 700;
        }

        .ex-fee {
            font-size: 10px;
            color: var(--hint);
        }

        /* Loading */
        .loading-container {
            text-align: center;
            padding: 40px 20px;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid var(--border);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 14px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 14px;
            color: var(--hint);
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4) infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        /* Error */
        .error-card {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .error-emoji { font-size: 44px; margin-bottom: 8px; }
        .error-text { color: var(--red); font-size: 14px; margin-bottom: 12px; }

        .retry-btn {
            padding: 10px 24px;
            background: var(--red);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px 0 8px;
            font-size: 11px;
            color: var(--hint);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-badge">🟢 ۵ صرافی آنلاین</div>
            <span class="header-icon">💎</span>
            <h1>USDT Arbitrage</h1>
            <p>پایش لحظه‌ای فرصت‌های آربیتراژ</p>
        </div>

        <!-- Investment Input -->
        <div class="card">
            <div class="card-label">
                <span class="emoji">💰</span>
                <span>مبلغ سرمایه (تومان)</span>
            </div>
            <div class="input-row">
                <input type="text" id="investment" value="20,000,000" inputmode="numeric">
                <div class="currency">تومان</div>
            </div>
            <div class="quick-amounts">
                <div class="quick-btn" onclick="setAmount(1000000)">۱M</div>
                <div class="quick-btn" onclick="setAmount(5000000)">۵M</div>
                <div class="quick-btn" onclick="setAmount(10000000)">۱۰M</div>
                <div class="quick-btn" onclick="setAmount(20000000)">۲۰M</div>
                <div class="quick-btn" onclick="setAmount(50000000)">۵۰M</div>
            </div>
        </div>

        <!-- Main Button -->
        <button class="btn-main" id="mainBtn" onclick="calculate()">
            🔍 محاسبه آربیتراژ
        </button>

        <!-- Status -->
        <div class="status" id="status" style="display: none;">
            <div class="status-dot"></div>
            <span id="statusText">آماده</span>
        </div>

        <!-- Result Container -->
        <div id="result"></div>

        <!-- Footer -->
        <div class="footer">
            ⚡ بروزرسانی لحظه‌ای | USDT Arbitrage Bot
        </div>
    </div>

    <script>
        // ==================== CONFIG ====================
        const API_URL = "https://usdt-bot.alir3zaww.workers.dev/";
        
        // Exchange colors
        const EXCHANGE_COLORS = {
            'Nobitex': '#3b82f6',
            'Wallex': '#8b5cf6',
            'Bitpin': '#f59e0b',
            'OMPFinex': '#ec4899',
            'Abantether': '#10b981'
        };

        // ==================== HELPERS ====================
        function formatNumber(num) {
            if (num === undefined || num === null || isNaN(num)) return '---';
            return Number(num).toLocaleString('en-US');
        }

        function formatInput(str) {
            const num = parseFloat(str.replace(/,/g, ''));
            if (isNaN(num)) return '';
            return num.toLocaleString('en-US');
        }

        function parseAmount(str) {
            return parseFloat(str.replace(/,/g, '')) || 0;
        }

        function setAmount(amount) {
            document.getElementById('investment').value = amount.toLocaleString('en-US');
            calculate();
        }

        // Input formatting
        document.getElementById('investment').addEventListener('input', function(e) {
            const raw = this.value.replace(/,/g, '');
            if (raw === '' || isNaN(raw)) {
                this.value = '';
                return;
            }
            this.value = formatInput(raw);
        });

        // ==================== CALCULATE ====================
        async function calculate() {
            const investment = parseAmount(document.getElementById('investment').value);
            const resultDiv = document.getElementById('result');
            const mainBtn = document.getElementById('mainBtn');
            const statusDiv = document.getElementById('status');
            const statusText = document.getElementById('statusText');

            // Validation
            if (!investment || investment < 100000) {
                resultDiv.innerHTML = `
                    <div class="error-card">
                        <div class="error-emoji">⚠️</div>
                        <div class="error-text">حداقل سرمایه: ۱۰۰,۰۰۰ تومان</div>
                    </div>
                `;
                return;
            }

            // Loading state
            mainBtn.classList.add('loading');
            mainBtn.innerHTML = '⏳ <span class="loading-dots">در حال دریافت قیمت</span>';
            statusDiv.style.display = 'flex';
            statusText.textContent = 'دریافت از صرافی‌ها...';
            
            resultDiv.innerHTML = `
                <div class="loading-container">
                    <div class="spinner"></div>
                    <div class="loading-text">دریافت قیمت از ۵ صرافی<span class="loading-dots"></span></div>
                </div>
            `;

            try {
                const url = `${API_URL}?investment=${investment}`;
                
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 12000);
                
                const response = await fetch(url, {
                    signal: controller.signal,
                    headers: { 'Accept': 'application/json' }
                });
                
                clearTimeout(timeout);

                if (!response.ok) {
                    throw new Error(`خطای سرور (${response.status})`);
                }

                const data = await response.json();

                // Validate response structure
                if (!data || data.error) {
                    throw new Error(data?.error || 'پاسخ نامعتبر از سرور');
                }

                if (!data.bestBuy || !data.bestSell || !data.profit) {
                    throw new Error('داده‌های آربیتراژ ناقص است');
                }

                // Success
                statusText.textContent = `✅ بروزرسانی شد | ${new Date().toLocaleTimeString('fa-IR')}`;
                mainBtn.classList.remove('loading');
                mainBtn.innerHTML = '🔄 بروزرسانی مجدد';
                
                renderResult(data);

            } catch (error) {
                console.error('Fetch error:', error);
                
                statusText.textContent = '❌ خطا در دریافت';
                mainBtn.classList.remove('loading');
                mainBtn.innerHTML = '🔄 تلاش مجدد';
                
                let errorMsg = error.message;
                if (error.name === 'AbortError') {
                    errorMsg = 'زمان درخواست به پایان رسید';
                } else if (error.message.includes('Failed to fetch')) {
                    errorMsg = 'اتصال به سرور برقرار نشد';
                }
                
                resultDiv.innerHTML = `
                    <div class="error-card">
                        <div class="error-emoji">🔴</div>
                        <div class="error-text">${errorMsg}</div>
                        <button class="retry-btn" onclick="calculate()">🔄 تلاش مجدد</button>
                    </div>
                `;
            }
        }

        // ==================== RENDER ====================
        function renderResult(data) {
            const { bestBuy, bestSell, profit, exchanges, investment } = data;
            
            // Calculate spread (since API might not include it)
            const spreadDiff = bestSell.price - bestBuy.price;
            const spreadPct = ((spreadDiff / bestBuy.price) * 100).toFixed(2);
            
            const isProfitable = profit.net > 0;
            
            let exchangesHTML = '';
            if (exchanges) {
                exchangesHTML = Object.entries(exchanges).map(([name, ex]) => {
                    const color = EXCHANGE_COLORS[name] || '#94a3b8';
                    const firstLetter = name.charAt(0);
                    const fee = data.bestBuy.exchange === name ? data.bestBuy.fee : 
                               data.bestSell.exchange === name ? data.bestSell.fee : 0;
                    
                    return `
                        <div class="exchange-item">
                            <div class="ex-left">
                                <div class="ex-icon" style="background: ${color};">${firstLetter}</div>
                                <div class="ex-name">${name}</div>
                            </div>
                            <div class="ex-prices">
                                <div class="ex-ask">${formatNumber(ex.ask)} خرید</div>
                                <div class="ex-bid">${formatNumber(ex.bid)} فروش</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('result').innerHTML = `
                <!-- Arbitrage Banner -->
                <div class="arbitrage-banner">
                    <div class="arbitrage-title">🎯 بهترین فرصت آربیتراژ</div>
                    
                    <div class="arb-grid">
                        <div class="arb-mini buy">
                            <div class="arb-mini-label">🟢 خرید از</div>
                            <div class="arb-mini-exchange">${bestBuy.exchange}</div>
                            <div class="arb-mini-price green-text">${formatNumber(bestBuy.price)}</div>
                            <div class="arb-mini-fee">کارمزد: %${(bestBuy.fee * 100).toFixed(2)}</div>
                        </div>
                        <div class="arb-mini sell">
                            <div class="arb-mini-label">🔴 فروش به</div>
                            <div class="arb-mini-exchange">${bestSell.exchange}</div>
                            <div class="arb-mini-price red-text">${formatNumber(bestSell.price)}</div>
                            <div class="arb-mini-fee">کارمزد: %${(bestSell.fee * 100).toFixed(2)}</div>
                        </div>
                    </div>
                    
                    <div class="spread-bar">
                        <div class="spread-label">اختلاف قیمت</div>
                        <div class="spread-value">${formatNumber(spreadDiff)} تومان</div>
                        <div class="spread-pct">(%${spreadPct} به ازای هر USDT)</div>
                    </div>
                </div>

                <!-- Profit Card -->
                <div class="profit-card">
                    <div class="profit-title">💵 محاسبه سود و هزینه</div>
                    
                    <div class="profit-row">
                        <span class="profit-label">💰 سرمایه</span>
                        <span class="profit-value">${formatNumber(investment)} تومان</span>
                    </div>
                    
                    <div class="profit-row">
                        <span class="profit-label">📈 سود ناخالص</span>
                        <span class="profit-value yellow-text">${formatNumber(Math.round(profit.gross))} تومان</span>
                    </div>
                    
                    <div class="profit-row">
                        <span class="profit-label">🧾 کارمزد کل</span>
                        <span class="profit-value red-text">${formatNumber(Math.round(profit.fees))} تومان</span>
                    </div>
                    
                    <div class="profit-highlight ${isProfitable ? 'positive' : 'negative'}">
                        <div class="profit-highlight-label">
                            ${isProfitable ? '🟢 سود خالص' : '🔴 ضرر خالص'}
                        </div>
                        <div class="profit-highlight-value ${isProfitable ? 'green-text' : 'red-text'}">
                            ${formatNumber(Math.abs(Math.round(profit.net)))} تومان
                        </div>
                        <div class="profit-highlight-pct ${isProfitable ? 'green-text' : 'red-text'}">
                            ${isProfitable ? '+' : ''}%${profit.netPercent.toFixed(3)}
                        </div>
                    </div>
                </div>

                <!-- Exchanges List -->
                <div class="exchanges-title">📊 قیمت‌های لحظه‌ای</div>
                ${exchangesHTML}

                <div style="text-align: center; margin-top: 12px; font-size: 11px; color: var(--hint);">
                    ⏰ ${new Date().toLocaleTimeString('fa-IR')}
                </div>
            `;

            // Scroll to top of result
            document.querySelector('.arbitrage-banner')?.scrollIntoView({ 
                behavior: 'smooth', 
                block: 'start' 
            });
        }

        // ==================== INIT ====================
        function init() {
            // Auto calculate on load
            setTimeout(calculate, 600);
            
            // Allow Enter key to calculate
            document.getElementById('investment').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') calculate();
            });
        }

        init();
    </script>
</body>
