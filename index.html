<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>USDT Arbitrage</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
      padding: 16px;
    }

    .card {
      background: #1c1c1c;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-top: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #2ecc71;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      color: black;
      font-weight: bold;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
    }

    .green { color: #2ecc71; }
    .red { color: #ff4d4d; }
  </style>
</head>

<body>

  <h2>USDT Arbitrage</h2>

  <input id="inv" type="number" value="20000000" />

  <button onclick="calc()">Calculate</button>

  <div id="out"></div>

  <script>
    const API = "https://usdt-bot.alir3zaww.workers.dev/";

    async function calc() {
      const inv = document.getElementById("inv").value;

      const res = await fetch(`${API}?investment=${inv}`);
      const data = await res.json();

      document.getElementById("out").innerHTML = `
        <div class="card">
          <div class="row">
            <span>Best Buy</span>
            <span class="green">${data.bestBuy.exchange} @ ${data.bestBuy.price}</span>
          </div>

          <div class="row">
            <span>Best Sell</span>
            <span class="red">${data.bestSell.exchange} @ ${data.bestSell.price}</span>
          </div>

          <div class="row">
            <span>Gross</span>
            <span>${data.profit.gross.toFixed(0)}</span>
          </div>

          <div class="row">
            <span>Fees</span>
            <span>${data.profit.fees.toFixed(0)}</span>
          </div>

          <div class="row">
            <span>Net Profit</span>
            <span class="green">${data.profit.net.toFixed(0)}</span>
          </div>

          <div class="row">
            <span>ROI</span>
            <span class="green">${data.profit.netPercent.toFixed(3)}%</span>
          </div>
        </div>
      `;
    }
  </script>

</body>
</html>
