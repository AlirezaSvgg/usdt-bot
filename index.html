<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>USDT Arbitrage - Live Engine</title>
<style>
  body {
    margin: 0;
    font-family: Consolas, monospace;
    background: #0f0f0f;
    color: #fff;
    padding: 16px;
  }

  h2 { color: #ffcc00; }

  input, button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
    margin-top: 10px;
  }

  button {
    background: #2ecc71;
    color: black;
    font-weight: bold;
    cursor: pointer;
  }

  pre {
    background: #1c1c1c;
    padding: 12px;
    border-radius: 8px;
    overflow-x: auto;
    margin-top: 12px;
  }

  .green { color: #2ecc71; }
  .red { color: #ff4d4d; }
</style>
</head>
<body>

<h2>🔍 USDT PRICES - LIVE ENGINE</h2>

<input id="inv" type="number" value="20000000" />
<button onclick="run()">CALCULATE</button>

<pre id="out">Waiting...</pre>

<script>
const API = "https://usdt-bot.alir3zaww.workers.dev/";

async function run() {
  const inv = document.getElementById("inv").value;
  const out = document.getElementById("out");
  out.textContent = "Loading...";

  try {
    const res = await fetch(`${API}?investment=${inv}`);
    const data = await res.json();

    // نمایش دقیق شبیه CLI
    out.innerHTML = `
🔍 USDT PRICES - ${inv} Toman
============================================================
${Object.entries(data.exchanges).map(([ex, v]) => {
      if(!v) return `${ex} | No Data`;
      return `${ex.padEnd(12)} | ASK (Buy) : ${v.ask.toLocaleString().padStart(10)} Toman | BID (Sell): ${v.bid.toLocaleString().padStart(10)} Toman | Fee: ${(data.bestBuy.exchange===ex ? data.bestBuy.fee : (data.bestSell.exchange===ex ? data.bestSell.fee : 0)).toFixed(3)}%`
    }).join("\n")}

🟢 Lowest ASK  (Buy USDT)  : ${data.bestBuy.exchange} @ ${data.bestBuy.price.toLocaleString()} Toman (Fee: ${(data.bestBuy.fee*100).toFixed(2)}%)
🔴 Highest BID (Sell USDT) : ${data.bestSell.exchange} @ ${data.bestSell.price.toLocaleString()} Toman (Fee: ${(data.bestSell.fee*100).toFixed(2)}%)
💰 Spread: ${data.spread.diff.toLocaleString()} Toman (${data.spread.diffPct.toFixed(2)}%) per USDT

💵 PROFIT CALCULATION (Investment: ${inv.toLocaleString()} Toman):
   Buy  : ${inv.toLocaleString()} Toman → ${(inv*(1-data.bestBuy.fee)/data.bestBuy.price).toFixed(4)} USDT @ ${data.bestBuy.price.toLocaleString()} Toman (Fee: ${(inv*data.bestBuy.fee).toLocaleString()} T)
   Sell : ${(inv*(1-data.bestBuy.fee)/data.bestBuy.price).toFixed(4)} USDT → ${( ((inv*(1-data.bestBuy.fee)/data.bestBuy.price)*data.bestSell.price) ).toLocaleString()} Toman @ ${data.bestSell.price.toLocaleString()} Toman (Fee: ${(((inv*(1-data.bestBuy.fee)/data.bestBuy.price)*data.bestSell.price)*data.bestSell.fee).toLocaleString()} T)
   ─────────────────────────────────────────────
   Gross Profit : ${data.profit.gross.toLocaleString()} Toman
   Total Fee    : ${data.profit.fees.toLocaleString()} Toman
   Net Profit   : ${data.profit.net.toLocaleString()} Toman (${data.profit.netPercent.toFixed(2)}%)

⏰ ${new Date().toLocaleTimeString()}
    `;
  } catch(e) {
    out.textContent = "ERROR: " + e.message;
  }
}
</script>

</body>
</html>
