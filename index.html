<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔥 داشبورد آربیتراژ USDT</title>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      background-color: #121212;
      color: #f5f5f5;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      background-color: #1e1e1e;
      width: 100%;
      padding: 1rem;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    header h1 {
      margin: 0;
      font-size: 1.8rem;
      color: #ffcc00;
    }
    main {
      flex: 1;
      width: 100%;
      max-width: 700px;
      padding: 2rem;
      box-sizing: border-box;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    table, th, td {
      border: 1px solid #333;
    }
    th, td {
      padding: 0.8rem;
      text-align: center;
    }
    th {
      background-color: #1f1f1f;
      color: #ffcc00;
    }
    td {
      background-color: #1a1a1a;
    }
    .profit {
      color: #4caf50;
      font-weight: bold;
    }
    .loss {
      color: #f44336;
      font-weight: bold;
    }
    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>
<body>
  <header>
    <h1>🔥 داشبورد آربیتراژ USDT</h1>
  </header>
  <main>
    <p>در حال بارگذاری داده‌ها...</p>
    <table id="arb-table" style="display:none;">
      <thead>
        <tr>
          <th>صرافی</th>
          <th>خرید (ASK)</th>
          <th>فروش (BID)</th>
          <th>کارمزد</th>
        </tr>
      </thead>
      <tbody>
        <!-- اینجا ردیف‌ها توسط جاوااسکریپت اضافه می‌شوند -->
      </tbody>
    </table>
    <p id="summary" style="margin-top:1rem;"></p>
  </main>
  <footer>
    ⏰ آخرین بروزرسانی: <span id="time">—</span>
  </footer>

  <script>
    async function fetchData() {
      // نمونه داده (بعداً API واقعی میاد اینجا)
      const data = {
        "Nobitex": {"best_bid":173488,"best_ask":173492,"fee":0.25},
        "Wallex": {"best_bid":173500,"best_ask":173510,"fee":0.3},
        "Bitpin": {"best_bid":173480,"best_ask":173490,"fee":0.35},
        "OMPFinex": {"best_bid":173495,"best_ask":173505,"fee":0.35},
        "Abantether": {"best_bid":173485,"best_ask":173495,"fee":0.3}
      };

      const table = document.getElementById('arb-table');
      const tbody = table.querySelector('tbody');
      tbody.innerHTML = '';

      let minAsk = Infinity, maxBid = 0, buyEx='', sellEx='';

      for (let ex in data) {
        const row = document.createElement('tr');
        const bid = data[ex].best_bid;
        const ask = data[ex].best_ask;
        const fee = data[ex].fee;

        row.innerHTML = `<td>${ex}</td>
                         <td>${ask.toLocaleString()} تومان</td>
                         <td>${bid.toLocaleString()} تومان</td>
                         <td>${fee}%</td>`;
        tbody.appendChild(row);

        if (ask < minAsk) { minAsk = ask; buyEx = ex; }
        if (bid > maxBid) { maxBid = bid; sellEx = ex; }
      }

      table.style.display = 'table';

      const diff = maxBid - minAsk;
      const diffPct = (diff / minAsk * 100).toFixed(2);
      const summary = document.getElementById('summary');
      summary.innerHTML = `🟢 خرید از ${buyEx} | 🔴 فروش در ${sellEx} | 💰 اختلاف: ${diff.toLocaleString()} تومان (${diffPct}%)`;

      document.getElementById('time').textContent = new Date().toLocaleTimeString();
    }

    fetchData();
    setInterval(fetchData, 10000); // هر 10 ثانیه آپدیت
  </script>
</body>
</html>
