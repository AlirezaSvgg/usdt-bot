<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>USDT Arbitrage Dashboard</title>
  <style>
    body { font-family: Tahoma, sans-serif; background: #1e1e1e; color: #f1f1f1; padding: 20px; }
    h1 { color: #ffcc00; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 10px; text-align: center; border: 1px solid #444; }
    th { background: #333; }
    td { background: #222; }
    .profit { color: #00ff00; font-weight: bold; }
    .loss { color: #ff4444; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🔥 USDT Arbitrage Dashboard</h1>
  <p>Simulated buy/sell prices, fees, and net profit for 5 exchanges.</p>

  <table id="arbTable">
    <thead>
      <tr>
        <th>Exchange</th>
        <th>Buy Price (Toman)</th>
        <th>Sell Price (Toman)</th>
        <th>Fee (%)</th>
        <th>Simulated Profit (Toman)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const exchanges = [
      { name: "Nobitex", fee: 0.25 },
      { name: "Wallex", fee: 0.3 },
      { name: "Bitpin", fee: 0.35 },
      { name: "OMPFinex", fee: 0.35 },
      { name: "Abantether", fee: 0.3 },
    ];

    const investment = 20000000; // simulated investment in Toman

    function randomPrice(base, variance = 500) {
      return Math.round(base + (Math.random() - 0.5) * 2 * variance);
    }

    function updateTable() {
      const tbody = document.querySelector("#arbTable tbody");
      tbody.innerHTML = "";

      const results = exchanges.map(ex => {
        const buy = randomPrice(173000);
        const sell = randomPrice(174000);
        const grossProfit = (sell * (1 - ex.fee/100) - buy * (1 + ex.fee/100)) * (investment / buy);
        return { ...ex, buy, sell, profit: grossProfit };
      });

      results.forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${r.name}</td>
          <td>${r.buy.toLocaleString()}</td>
          <td>${r.sell.toLocaleString()}</td>
          <td>${r.fee.toFixed(2)}</td>
          <td class="${r.profit >= 0 ? 'profit' : 'loss'}">${r.profit.toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    setInterval(updateTable, 2000);
    updateTable();
  </script>
</body>
</html>
