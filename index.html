<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USDT Arbitrage Mini App</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: #fff;
      padding: 16px;
    }

    .card {
      background: #1c1c1c;
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    button {
      background: #2ecc71;
      font-weight: bold;
      cursor: pointer;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
    }

    .green { color: #2ecc71; }
    .red { color: #ff4d4d; }
    .muted { color: #aaa; }
  </style>
</head>

<body>

<h2>🔍 USDT Arbitrage</h2>

<input id="inv" type="number" value="20000000">
<button onclick="calc()">CALCULATE</button>

<div id="out" class="card">
  <div class="muted">Waiting...</div>
</div>

<script>
const API = "https://usdt-bot.alir3zaww.workers.dev/";

async function calc() {
  const out = document.getElementById("out");
  const inv = document.getElementById("inv").value;

  out.innerHTML = `<div class="muted">Loading...</div>`;

  try {
    const res = await fetch(`${API}?investment=${inv}`);
    const data = await res.json();

    if (!data.bestBuy || !data.bestSell || !data.profit) {
      out.innerHTML = `<div class="red">Invalid API response</div>`;
      return;
    }

    out.innerHTML = `
      <div class="row">
        <span>Best Buy</span>
        <span class="green">${data.bestBuy.exchange} @ ${data.bestBuy.price}</span>
      </div>

      <div class="row">
        <span>Best Sell</span>
        <span class="red">${data.bestSell.exchange} @ ${data.bestSell.price}</span>
      </div>

      <div class="row">
        <span>Spread</span>
        <span>${data.spread.diff} (${data.spread.diffPct.toFixed(2)}%)</span>
      </div>

      <div class="row">
        <span>Gross</span>
        <span>${Math.round(data.profit.gross)}</span>
      </div>

      <div class="row">
        <span>Fees</span>
        <span>${Math.round(data.profit.fees)}</span>
      </div>

      <div class="row">
        <span class="green">Net Profit</span>
        <span class="green">${Math.round(data.profit.net)}</span>
      </div>

      <div class="row">
        <span>ROI</span>
        <span class="green">${data.profit.netPercent.toFixed(3)}%</span>
      </div>
    `;

  } catch (e) {
    out.innerHTML = `<div class="red">Fetch Error</div>`;
  }
}
</script>

</body>
</html>
